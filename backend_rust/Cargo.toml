[package]
name = "redlamp-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
actix-cors = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.32", features = ["full"] }
csv = "1.3"
log = "0.4"
env_logger = "0.10"

